name: Qt6 CI

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "**"
    paths-ignore:
      - .gitignore
      - README.md

  pull_request:
    branches:
      - qt6
    paths-ignore:
      - .gitignore
      - README.md

concurrency:
  # cancel jobs on PRs only
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  QT_VERSION: 6.9.1

jobs:
  build:
    name: Build qios
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: source
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Download Qt
        uses: jurplel/install-qt-action@v4
        with:
          aqtversion: ==3.1.*
          version: ${{ env.QT_VERSION }}
          target: ios

      - name: Prepare Qt
        run: |
          rm $QT_ROOT_DIR/lib/cmake/Qt6Gui/Qt6QIOSIntegrationPlugin*
          rm $QT_ROOT_DIR/lib/cmake/Qt6Gui/Qt6QIosOptionalPlugin_NSPhotoLibraryPlugin*

      - name: Setup ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Build qios
        run: |
          mkdir build && cd build
          qt-cmake ../source/ \
            -G"Ninja Multi-Config" \
            -DCMAKE_CONFIGURATION_TYPES="Release;Debug" \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DQT_GENERATE_SBOM=OFF \
            -DQT_HOST_PATH=$(readlink -f $QT_ROOT_DIR/../macos)
          ninja
          DESTDIR=../install ninja install

      - name: Create artifacts
        run: |
          pushd install/Users/runner/work/qios
          tar cjvf ../../../../../qios.tar.bz2 Qt
          popd

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qios
          path: qios.tar.bz2

  release:
    name: Release qios
    if: github.ref_type == 'tag'
    runs-on: macos-14
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: qios

      - name: Make tarball
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mv qios.tar.bz2 qios_${TAG_NAME}.tar.bz2

      - name: Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: qios_${{ github.ref_name }}.tar.bz2
          allowUpdates: true
          draft: true
